<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Documents - MindVault AI</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="dashboard-container">

    <!-- HEADER -->
    <header class="dashboard-header">

        <div>
            <h1>📄 My Documents</h1>
            <p>Upload and manage your documents.</p>
        </div>

        <div>
            <a href="/dashboard.html" class="btn">
                ← Dashboard
            </a>

            <button
                    id="logoutBtn"
                    class="btn"
                    type="button">
                Logout
            </button>
        </div>

    </header>


    <!-- UPLOAD DOCUMENT -->
    <section class="note-create-card">

        <h2>Upload New Document</h2>

        <form id="documentUploadForm">

            <label for="documentFile">
                Select Document
            </label>

            <input
                    type="file"
                    id="documentFile"
                    required
            >


            <label for="documentCollectionId">
                Collection
            </label>

            <select id="documentCollectionId">

                <option value="">
                    No Collection
                </option>

            </select>


            <br><br>

            <button type="submit">
                📤 Upload Document
            </button>

        </form>

        <p id="documentMessage"></p>

    </section>


    <!-- SEARCH DOCUMENTS -->
    <section class="notes-section">

        <div class="search-container">

            <input
                    type="text"
                    id="documentSearch"
                    placeholder="Search documents..."
            >

            <button
                    type="button"
                    id="searchDocumentsBtn">
                🔍 Search
            </button>

            <button
                    type="button"
                    id="showAllDocumentsBtn">
                Show All
            </button>

        </div>


        <!-- DOCUMENTS -->
        <div id="documentsContainer">

            <p>Loading documents...</p>

        </div>

    </section>

</div>


<script src="/script.js"></script>

</body>

</html>
