<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - MindVault AI</title>

    <link rel="stylesheet" href="/style.css">

</head>


<body>


<div class="auth-container">


    <div class="auth-card">


        <h1>Create Account</h1>


        <p>
            Start building your AI knowledge vault
        </p>


        <form id="registerForm">


            <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your name"
                    required
            >


            <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
            >


            <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create password"
                    required
            >


            <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
            >


            <button type="submit">
                Create Account
            </button>


        </form>


        <p id="registerMessage"></p>


        <p class="auth-link">

            Already have an account?

            <a href="/login.html">
                Login
            </a>

        </p>


        <p class="auth-link">

            <a href="/index.html">
                ← Back to Home
            </a>

        </p>


    </div>


</div>


<script src="/script.js"></script>


</body>

</html>
