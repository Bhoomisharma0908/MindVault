<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - MindVault AI</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="auth-container">


    <div class="auth-card">


        <h1>
            Create Account
        </h1>


        <p>
            Start building your AI knowledge vault
        </p>



        <form>


            <input
                    type="text"
                    placeholder="Enter your name">



            <input
                    type="email"
                    placeholder="Enter your email">



            <input
                    type="password"
                    placeholder="Create password">



            <input
                    type="password"
                    placeholder="Confirm password">



            <button>
                Create Account
            </button>


        </form>




        <p class="auth-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>



    </div>


</div>


</body>

</html> //done
