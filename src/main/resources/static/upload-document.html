<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Document | MindVault AI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>MindVault AI</h2>

        <nav>

            <a href="dashboard.html">🏠 Dashboard</a>

            <a href="notes.html">📝 My Notes</a>

            <a href="documents.html">📄 Documents</a>

            <a href="ai-chat.html">🤖 AI Chat</a>

            <a href="collections.html">📚 Collections</a>

            <a href="settings.html">⚙️ Settings</a>

        </nav>

    </aside>

    <!-- Main Content -->

    <main class="upload-content">

        <h1>Upload Document</h1>

        <!-- Upload Box -->

        <div class="upload-box">

            <h2>📄 Drag & Drop Files Here</h2>

            <p>or</p>

            <input type="file" id="fileInput">

            <br><br>

            <button class="choose-btn">

                Choose File

            </button>

        </div>

        <!-- Supported Formats -->

        <div class="upload-info">

            <h3>Supported Formats</h3>

            <ul>

                <li>PDF</li>

                <li>DOCX</li>

                <li>PPT</li>

                <li>TXT</li>

            </ul>

        </div>

        <!-- Selected File -->

        <div class="file-preview">

            <h3>Selected File</h3>

            <div class="preview-card">

                <div class="preview-icon">

                    📄

                </div>

                <div class="preview-details">

                    <h4>Spring Boot Guide.pdf</h4>

                    <p>2.5 MB</p>

                </div>

                <button class="remove-btn">

                    Remove

                </button>

            </div>

        </div>

        <!-- Progress -->

        <div class="progress-section">

            <h3>Upload Progress</h3>

            <div class="progress-bar">

                <div class="progress-fill">

                    70%

                </div>

            </div>

        </div>

        <!-- Action Buttons -->

        <div class="upload-actions">

            <button class="upload-file-btn">

                Upload

            </button>

            <button class="cancel-upload-btn">

                Cancel

            </button>

        </div>

    </main>

</div>

</body>

</html>
