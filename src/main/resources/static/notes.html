<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes - MindVault AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>MindVault AI</h2>

        <nav>
            <a href="dashboard.html">🏠 Dashboard</a>
            <a href="notes.html">📝 My Notes</a>
            <a href="#">📄 Documents</a>
            <a href="#">🤖 AI Chat</a>
            <a href="#">📚 Collections</a>
            <a href="#">⚙ Settings</a>
        </nav>

    </aside>

    <!-- Main Content -->

    <main class="notes-content">

        <div class="notes-header">

            <h1>My Notes</h1>

            <a href="create-note.html">
                <button class="new-note-btn">
                    + New Note
                </button>
            </a>

        </div>

        <div class="search-bar">

            <input
                    type="text"
                    placeholder="Search your notes...">

        </div>

        <div class="notes-grid">

            <div class="note-card">

                <h2>Spring Boot Security</h2>

                <p>
                    JWT Authentication, Spring Security,
                    Role-Based Authorization...
                </p>

                <div class="note-tags">
                    <span>Java</span>
                    <span>Spring Boot</span>
                </div>

                <div class="note-actions">

                    <button>Edit</button>

                    <button>Delete</button>

                    <button>Pin</button>

                </div>

            </div>

            <div class="note-card">

                <h2>Machine Learning</h2>

                <p>
                    Regression, Classification,
                    Decision Trees...
                </p>

                <div class="note-tags">
                    <span>ML</span>
                    <span>AI</span>
                </div>

                <div class="note-actions">

                    <button>Edit</button>

                    <button>Delete</button>

                    <button>Pin</button>

                </div>

            </div>

        </div>

    </main>

</div>

</body>
</html>
