<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - MindVault AI</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="auth-container">


    <div class="auth-card">


        <h1>
            Welcome Back
        </h1>


        <p>
            Login to access your AI knowledge vault
        </p>



        <form>


            <input
                    type="email"
                    placeholder="Enter your email">


            <input
                    type="password"
                    placeholder="Enter your password">



            <a href="dashboard.html">
                <button type="button">
                    Login
                </button>
            </a>


        </form>



        <p class="auth-link">

            Don't have an account?
            <a href="register.html">
                Create Account
            </a>

        </p>



    </div>


</div>


</body>

</html>
