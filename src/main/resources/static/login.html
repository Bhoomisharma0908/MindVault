<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - MindVault AI</title>

    <link rel="stylesheet" href="/style.css">

</head>


<body>


<div class="auth-container">


    <div class="auth-card">


        <h1>Welcome Back</h1>


        <p>
            Login to your MindVault AI account
        </p>


        <form id="loginForm">


            <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
            >


            <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
            >


            <button type="submit">
                Login
            </button>


        </form>


        <p id="loginMessage"></p>


        <p class="auth-link">

            Don't have an account?

            <a href="/register.html">
                Create Account
            </a>

        </p>


        <p class="auth-link">

            <a href="/index.html">
                ← Back to Home
            </a>

        </p>


    </div>


</div>


<script src="/script.js"></script>


</body>

</html>
